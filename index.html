<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRONLOG</title>
<style>
:root{
  --bg:#0B0D0F;
  --surface:#14171B;
  --surface2:#1C2025;
  --surface3:#22272D;
  --border:#262B31;
  --text:#F2F3F4;
  --text-dim:#8A9199;
  --text-faint:#565C63;
  --accent:#FF4B3E;
  --accent-dim:#5A211B;
  --success:#37D67A;
  --gold:#E8B44C;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",monospace;}
.disp{font-weight:800;text-transform:uppercase;letter-spacing:0.02em;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

#topbar{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;}
#topbar .brand{font-size:20px;letter-spacing:0.08em;}
#topbar .brand span{color:var(--accent);}
#topbar .streak{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
#topbar .streak b{color:var(--gold);font-family:ui-monospace,monospace;}

#screen{flex:1;padding:4px 16px 90px;overflow-y:auto;}
h2.section-title{font-size:13px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;
  margin:22px 0 10px;font-weight:700;}
h2.section-title:first-child{margin-top:6px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.card-tap{transition:transform .08s ease, background .15s ease;}
.card-tap:active{transform:scale(0.98);background:var(--surface2);}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}

.btn{border:none;border-radius:8px;padding:12px 16px;font-weight:700;font-size:14px;text-align:center;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{background:#e0392c;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-ghost:active{background:var(--surface3);}
.btn-block{display:block;width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:7px;}
.btn-danger{background:transparent;color:var(--accent);border:1px solid var(--accent-dim);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .big{font-size:34px;margin-bottom:6px;}

#bottomnav{position:sticky;bottom:0;left:0;right:0;background:rgba(11,13,15,0.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;width:100%;z-index:40;}
#bottomnav button{flex:1;background:none;border:none;color:var(--text-faint);padding:10px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:0.04em;
  text-transform:uppercase;font-weight:700;}
#bottomnav button.active{color:var(--accent);}
#bottomnav svg{width:20px;height:20px;}

.exblock{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.exblock-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.exblock-head .name{font-weight:700;font-size:15px;}
.exblock-head .cat{font-size:11px;color:var(--text-dim);}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px 30px;gap:8px;align-items:center;padding:7px 14px;font-size:14px;}
.setrow.head{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;padding-bottom:2px;padding-top:10px;}
.setrow input[type=number]{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 6px;text-align:center;font-size:14px;}
.setrow input[type=number]:focus{outline:none;border-color:var(--accent);}
.setnum{color:var(--text-dim);font-size:13px;text-align:center;}
.checkbtn{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
.checkbtn.done{background:var(--success);border-color:var(--success);color:#06210F;}
.delbtn{width:26px;height:26px;border:none;background:none;color:var(--text-faint);font-size:16px;}
.addset{padding:10px 14px;color:var(--accent);font-weight:700;font-size:13px;text-align:center;border-top:1px solid var(--border);}

.pr-badge{display:inline-block;background:linear-gradient(135deg,var(--gold),#B8862F);color:#241a00;font-size:9.5px;
  font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:0.05em;margin-left:6px;transform:rotate(-3deg);}

#workoutOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;max-width:520px;margin:0 auto;}
#workoutOverlay.open{display:flex;}
.wo-header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.wo-header .timer{font-family:ui-monospace,monospace;font-size:15px;color:var(--text-dim);}
.wo-body{flex:1;overflow-y:auto;padding:14px 16px 100px;}
.wo-footer{position:sticky;bottom:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);}

#restTimer{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:120;
  background:var(--surface2);border-top:1px solid var(--border);padding:14px 18px;display:none;
  align-items:center;gap:14px;}
#restTimer.open{display:flex;}
.plate{position:relative;width:52px;height:52px;flex:none;}
.plate svg{width:52px;height:52px;transform:rotate(-90deg);}
.plate .ring-bg{fill:none;stroke:var(--surface3);stroke-width:5;}
.plate .ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.plate .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-weight:700;font-size:13px;}
#restTimer .rt-controls{margin-left:auto;display:flex;gap:8px;}

.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.chart-wrap .stat-row{display:flex;gap:18px;margin-top:8px;}
.stat-mini b{display:block;font-family:ui-monospace,monospace;font-size:18px;color:var(--text);}
.stat-mini span{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .dow{font-size:10px;color:var(--text-faint);padding-bottom:4px;}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;
  color:var(--text-dim);background:var(--surface2);}
.cal-day.has{background:var(--accent-dim);color:var(--text);font-weight:700;border:1px solid var(--accent);}
.cal-day.empty{background:transparent;}

#modalBg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:flex-end;}
#modalBg.open{display:flex;}
#modalSheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;
  max-height:88vh;overflow-y:auto;padding:16px 16px 30px;border-top:1px solid var(--border);}
.modal-title{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;}
.modal-title .x{color:var(--text-dim);font-size:22px;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:15px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}

.chip{display:inline-block;padding:6px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);margin:0 6px 6px 0;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.exlist-item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);}
.exlist-item:last-child{border-bottom:none;}
.exlist-item .n{font-weight:600;font-size:14.5px;}
.exlist-item .c{font-size:11px;color:var(--text-faint);}
.addicon{width:26px;height:26px;border-radius:50%;background:var(--surface3);color:var(--accent);border:none;font-size:16px;
  display:flex;align-items:center;justify-content:center;}

::-webkit-scrollbar{width:0;height:0;}
</style>

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(window.__IRONLOG_IMPORT){
    return window.__IRONLOG_IMPORT;
  }
  return {
    routines: [],
    history: [],
    bodyweight: [],
    customExercises: [],
    settings: { unit:"lb", restSeconds:90 },
    activeWorkout: null
  };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function allExercises(){ return BUILTIN_EXERCISES.concat(state.customExercises); }
function exById(id){ return allExercises().find(e=>e.id===id); }
function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtDateFull(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function bestE1RM(exId, beforeDate){
  let best = 0;
  for(const w of state.history){
    if(beforeDate && w.date >= beforeDate) continue;
    const ex = w.exercises.find(e=>e.exerciseId===exId);
    if(!ex) continue;
    for(const s of ex.sets){
      if(!s.completed) continue;
      const e1 = EPLEY(s.weight, s.reps);
      if(e1 > best) best = e1;
    }
  }
  return best;
}

function computeStreak(){
  const days = [...new Set(state.history.map(w=>w.date.slice(0,10)))].sort().reverse();
  if(days.length===0) return 0;
  let streak = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  let d = new Date(cursor);
  while(true){
    const iso = d.toISOString().slice(0,10);
    if(days.includes(iso)){ streak++; d.setDate(d.getDate()-1); }
    else if(iso === cursor.toISOString().slice(0,10)){ d.setDate(d.getDate()-1); continue; }
    else break;
  }
  return streak;
}

let currentTab = "home";
const screenEl = document.getElementById("screen");

document.getElementById("bottomnav").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  currentTab = btn.dataset.tab;
  render();
});

function render(){
  document.querySelectorAll("#bottomnav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===currentTab));
  document.getElementById("streakNum").textContent = computeStreak();
  if(currentTab==="home") renderHome();
  else if(currentTab==="routines") renderRoutines();
  else if(currentTab==="history") renderHistory();
  else if(currentTab==="progress") renderProgress();
  else if(currentTab==="settings") renderSettings();
}

function renderHome(){
  const recent = [...state.history].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  const totalVolume = state.history.reduce((s,w)=>s+w.exercises.reduce((s2,e)=>s2+e.sets.reduce((s3,st)=>st.completed?s3+st.weight*st.reps:s3,0),0),0);

  let html = `
  <div class="card" style="background:linear-gradient(135deg,var(--surface2),var(--surface));border-color:var(--border)">
    <div class="row">
      <div>
        <div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em">Total Workouts</div>
        <div class="disp mono" style="font-size:28px">${state.history.length}</div>
      </div>
      <div style="text-align:right">
        <div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em">Total Volume</div>
        <div class="disp mono" style="font-size:20px">${totalVolume.toLocaleString()}<span style="font-size:11px;color:var(--text-dim)"> ${state.settings.unit}</span></div>
      </div>
    </div>
  </div>
  <button class="btn btn-primary btn-block" id="startEmptyBtn" style="margin:10px 0;padding:15px;font-size:15px">+ Start Empty Workout</button>
  <h2 class="section-title">Your Routines</h2>`;

  if(state.routines.length===0){
    html += `<div class="empty-state"><div class="big">🏋️</div>No routines yet.<br><span style="color:var(--accent);font-weight:700">Build one in the Routines tab.</span></div>`;
  } else {
    html += state.routines.slice(0,4).map(r=>`
      <div class="card row card-tap start-routine-card" data-id="${r.id}">
        <div>
          <div style="font-weight:700;font-size:15px">${escapeHtml(r.name)}</div>
          <div class="muted" style="font-size:12px">${r.exercises.length} exercise${r.exercises.length===1?"":"s"}</div>
        </div>
        <button class="btn btn-primary btn-sm start-routine-btn" data-id="${r.id}">Start</button>
      </div>`).join("");
  }

  html += `<h2 class="section-title">Recent Activity</h2>`;
  if(recent.length===0){
    html += `<div class="empty-state faint">No workouts logged yet.</div>`;
  } else {
    html += recent.map(w=>{
      const vol = w.exercises.reduce((s,e)=>s+e.sets.reduce((s2,st)=>st.completed?s2+st.weight*st.reps:s2,0),0);
      const hasPR = w.exercises.some(e=>e.sets.some(s=>s.isPR));
      return `<div class="card card-tap view-workout-card" data-id="${w.id}">
        <div class="row">
          <div style="font-weight:700">${escapeHtml(w.name||"Workout")} ${hasPR?'<span class="pr-badge">PR</span>':""}</div>
          <div class="faint" style="font-size:12px">${fmtDate(w.date)}</div>
        </div>
        <div class="muted" style="font-size:12.5px;margin-top:4px">${w.exercises.length} exercises · ${vol.toLocaleString()} ${state.settings.unit} volume</div>
      </div>`;
    }).join("");
  }

  screenEl.innerHTML = html;

  document.getElementById("startEmptyBtn").onclick = ()=>startWorkout(null);
  screenEl.querySelectorAll(".start-routine-card,.start-routine-btn").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); startWorkout(el.dataset.id); };
  });
  screenEl.querySelectorAll(".view-workout-card").forEach(el=>{
    el.onclick = ()=> openWorkoutDetail(el.dataset.id);
  });
}

  <button class="btn btn-primary btn-block" id="newRoutineBtn" style="margin-bottom:14px">+ New Routine</button>`;

  } else {
    html += state.routines.map(r=>`
      <div class="card">
        <div class="row">

          <div style="display:flex;gap:8px">

            <button class="btn btn-danger btn-sm del-routine" data-id="${r.id}">Delete</button>
          </div>
        </div>
        <div class="muted" style="font-size:12.5px;margin-top:6px">${r.exercises.map(e=>exById(e.exerciseId)?.name||"?").join(", ")}</div>
      </div>`).join("");
  }
  screenEl.innerHTML = html;
  document.getElementById("newRoutineBtn").onclick = ()=>openRoutineEditor(null);

      state.routines = state.routines.filter(r=>r.id!==b.dataset.id);

    }
  });

function openRoutineEditor(routineId){
  const editing = routineId ? state.routines.find(r=>r.id===routineId) : null;
  let draft = editing ? JSON.parse(JSON.stringify(editing)) : {id:uid(), name:"", exercises:[]};

  function body(){
    return `
    <div class="modal-title">${editing?"Edit Routine":"New Routine"}<span class="x" id="mClose">&times;</span></div>
    <div class="field"><label>Routine Name</label><input id="rName" type="text" value="${escapeAttr(draft.name)}" placeholder="e.g. Push Day"></div>
    <h2 class="section-title" style="margin-top:16px">Exercises</h2>
    <div id="rExList">${draft.exercises.map((e,i)=>{
      const ex = exById(e.exerciseId);
      return `<div class="exlist-item">
        <div><div class="n">${ex?ex.name:"?"}</div><div class="c">${e.targetSets} sets × ${e.targetReps} reps</div></div>
        <button class="delbtn rm-ex" data-i="${i}">✕</button>
      </div>`;
    }).join("") || '<div class="faint" style="padding:8px 0">No exercises added yet.</div>'}</div>
    <button class="btn btn-ghost btn-block" id="addExBtn" style="margin:12px 0">+ Add Exercise</button>
    <button class="btn btn-primary btn-block" id="saveRoutineBtn">Save Routine</button>`;
  }

  openModal(body());
  wireRoutineEditorEvents();

  function wireRoutineEditorEvents(){
    document.getElementById("mClose").onclick = closeModal;
    document.getElementById("rName").oninput = (e)=>draft.name=e.target.value;
    document.getElementById("addExBtn").onclick = ()=>{
      openExercisePicker((ex)=>{
        draft.exercises.push({exerciseId:ex.id, targetSets:3, targetReps:10});
        openModal(body()); wireRoutineEditorEvents();
      });
    };
    document.querySelectorAll(".rm-ex").forEach(b=>b.onclick=()=>{
      draft.exercises.splice(parseInt(b.dataset.i),1);
      openModal(body()); wireRoutineEditorEvents();
    });
    document.getElementById("saveRoutineBtn").onclick = ()=>{
      if(!draft.name.trim()){ alert("Give your routine a name."); return; }
      if(draft.exercises.length===0){ alert("Add at least one exercise."); return; }
      const idx = state.routines.findIndex(r=>r.id===draft.id);
      if(idx>=0) state.routines[idx]=draft; else state.routines.push(draft);
      save(); closeModal(); renderRoutines();
    };
  }
}

function openExercisePicker(onPick){
  let filterCat = "All";
  let query = "";
  const cats = ["All", ...new Set(allExercises().map(e=>e.cat))];

  function body(){
    const list = allExercises().filter(e=>
      (filterCat==="All"||e.cat===filterCat) &&
      e.name.toLowerCase().includes(query.toLowerCase())
    );
    return `
    <div class="modal-title">Choose Exercise<span class="x" id="mClose">&times;</span></div>
    <div class="field"><input id="exSearch" type="text" placeholder="Search exercises..." value="${escapeAttr(query)}"></div>
    <div style="margin-bottom:10px">${cats.map(c=>`<span class="chip ${c===filterCat?"active":""}" data-c="${c}">${c}</span>`).join("")}</div>
    <div id="exListWrap">${list.map(e=>`
      <div class="exlist-item"><div><div class="n">${escapeHtml(e.name)}</div><div class="c">${e.cat}</div></div>
      <button class="addicon pick-ex" data-id="${e.id}">+</button></div>`).join("") || '<div class="faint" style="padding:10px 0">No matches.</div>'}
    </div>
    <button class="btn btn-ghost btn-block" id="newCustomExBtn" style="margin-top:14px">+ Create Custom Exercise</button>`;
  }
  openModal(body());
  wire();
  function wire(){
    document.getElementById("mClose").onclick = closeModal;
    document.getElementById("exSearch").oninput = (e)=>{ query=e.target.value; refresh(); };
    document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ filterCat=c.dataset.c; refresh(); });
    document.querySelectorAll(".pick-ex").forEach(b=>b.onclick=()=>{ onPick(exById(b.dataset.id)); });
    document.getElementById("newCustomExBtn").onclick = ()=>openCustomExerciseForm(onPick);
    function refresh(){ 
      const active = document.activeElement.id;
      openModal(body()); wire();
      if(active==="exSearch"){ const el=document.getElementById("exSearch"); el.focus(); el.selectionStart=el.selectionEnd=el.value.length; }
    }
  }
}

function openCustomExerciseForm(onPick){
  const cats = ["Chest","Back","Shoulders","Arms","Legs","Core","Cardio","Olympic","Other"];
  openModal(`
    <div class="modal-title">Custom Exercise<span class="x" id="mClose">&times;</span></div>
    <div class="field"><label>Name</label><input id="ceName" type="text" placeholder="e.g. Cable Pullover"></div>
    <div class="field"><label>Category</label><select id="ceCat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div>

  document.getElementById("mClose").onclick = closeModal;

    onPick(ex);

/* ========== AUDIO + HAPTICS ENGINE ========== */
let _actx = null;
function getACtx(){
  if(!_actx) _actx = new (window.AudioContext||window.webkitAudioContext)();
  if(_actx.state==='suspended') _actx.resume();
  return _actx;
}

function beep(freq=880, dur=0.08, vol=0.4, type='sine', delay=0){
  try{
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    const t = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.start(t); osc.stop(t+dur+0.01);
  }catch(e){}
}

function haptic(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

/* set completed: single soft tick */
function soundSetDone(isPR){
  if(isPR){
    beep(523,0.08,0.35,'sine');
    beep(659,0.08,0.35,'sine',0.09);
    beep(784,0.12,0.4,'sine',0.18);
    beep(1047,0.18,0.45,'sine',0.30);
    haptic([30,30,60,30,100]);
  } else {
    beep(660,0.06,0.3,'sine');
    haptic([25]);
  }
}

/* set unchecked: subtle reverse tick */
function soundSetUndo(){
  beep(330,0.05,0.15,'sine');
  haptic([10]);
}

/* rest timer started */
function soundRestStart(){
  beep(440,0.06,0.25,'sine');
  beep(550,0.06,0.25,'sine',0.07);
  haptic([15,10,15]);
}

/* rest timer last 3 seconds countdown beep */
function soundCountdown(){
  beep(660,0.05,0.3,'square');
  haptic([20]);
}

/* rest timer finished */
function soundRestDone(){
  beep(880,0.08,0.45,'sine');
  beep(1100,0.08,0.45,'sine',0.10);
  beep(880,0.12,0.45,'sine',0.20);
  haptic([50,30,50,30,150]);
}

/* workout complete fanfare */
function soundWorkoutDone(){
  const notes = [523,659,784,1047,784,1047,1319];
  const durs  = [0.1,0.1,0.1,0.15,0.08,0.1,0.25];
  let t = 0;
  notes.forEach((f,i)=>{ beep(f,durs[i],0.45,'sine',t); t+=durs[i]+0.02; });
  haptic([40,20,40,20,40,20,200]);
}

/* add exercise to workout */
function soundAddEx(){
  beep(440,0.04,0.2,'sine');
  haptic([12]);
}

let woInterval = null;
let restInterval = null;

function startWorkout(routineId){
  const routine = routineId ? state.routines.find(r=>r.id===routineId) : null;
  state.activeWorkout = {
    id: uid(),
    name: routine ? routine.name : "Empty Workout",
    date: new Date().toISOString(),
    startedAt: Date.now(),
    exercises: routine ? routine.exercises.map(e=>({
      exerciseId: e.exerciseId,
      sets: Array.from({length:e.targetSets},()=>({weight:0,reps:e.targetReps,completed:false,isPR:false}))
    })) : []
  };
  save();
  document.getElementById("woTitle").textContent = state.activeWorkout.name;
  document.getElementById("workoutOverlay").classList.add("open");
  renderWorkoutBody();
  clearInterval(woInterval);
  woInterval = setInterval(updateWoTimer, 1000);
  updateWoTimer();
}

function updateWoTimer(){
  if(!state.activeWorkout) return;
  const secs = Math.floor((Date.now()-state.activeWorkout.startedAt)/1000);
  const m = String(Math.floor(secs/60)).padStart(2,"0");
  const s = String(secs%60).padStart(2,"0");
  document.getElementById("woTimer").textContent = `${m}:${s}`;
}

function renderWorkoutBody(){
  const w = state.activeWorkout;
  const body = document.getElementById("woBody");
  let html = w.exercises.map((e,ei)=>{
    const ex = exById(e.exerciseId);
    return `<div class="exblock">
      <div class="exblock-head"><div><div class="name">${ex?ex.name:"?"}</div><div class="cat">${ex?ex.cat:""}</div></div>
      <button class="delbtn rm-exblock" data-ei="${ei}">✕</button></div>
      <div class="setrow head"><div>Set</div><div>${state.settings.unit}</div><div>Reps</div><div></div><div></div></div>
      ${e.sets.map((s,si)=>`
        <div class="setrow">
          <div class="setnum">${si+1}</div>
          <input type="number" inputmode="decimal" class="wInput" data-ei="${ei}" data-si="${si}" value="${s.weight||""}" placeholder="0">
          <input type="number" inputmode="numeric" class="rInput" data-ei="${ei}" data-si="${si}" value="${s.reps||""}" placeholder="0">
          <button class="checkbtn ${s.completed?"done":""} toggleSet" data-ei="${ei}" data-si="${si}">${s.completed?"✓":""}</button>
          <button class="delbtn rmSet" data-ei="${ei}" data-si="${si}">✕</button>
        </div>${s.isPR?`<div style="padding:0 14px 6px"><span class="pr-badge">NEW PR</span></div>`:""}`).join("")}
      <div class="addset addSetBtn" data-ei="${ei}">+ Add Set</div>
    </div>`;
  }).join("");
  html += `<button class="btn btn-ghost btn-block" id="woAddExBtn">+ Add Exercise</button>`;
  body.innerHTML = html;
  if(w.exercises.length===0){ body.innerHTML = `<div class="empty-state">Add an exercise to begin.</div><button class="btn btn-primary btn-block" id="woAddExBtn">+ Add Exercise</button>`; }

  document.getElementById("woAddExBtn")?.addEventListener("click", addExToActive);

  body.querySelectorAll(".wInput").forEach(inp=>inp.onchange=(e)=>{
    w.exercises[inp.dataset.ei].sets[inp.dataset.si].weight = parseFloat(inp.value)||0; save();
  });
  body.querySelectorAll(".rInput").forEach(inp=>inp.onchange=(e)=>{
    w.exercises[inp.dataset.ei].sets[inp.dataset.si].reps = parseInt(inp.value)||0; save();
  });
  body.querySelectorAll(".toggleSet").forEach(b=>b.onclick=()=>{
    const ei=b.dataset.ei, si=b.dataset.si;
    const set = w.exercises[ei].sets[si];
    set.completed = !set.completed;
    if(set.completed){
      const exId = w.exercises[ei].exerciseId;
      const best = bestE1RM(exId);
      const e1 = EPLEY(set.weight, set.reps);
      set.isPR = set.weight>0 && e1 > best;
      soundSetDone(set.isPR);
      startRestTimer(state.settings.restSeconds);
    } else { set.isPR = false; soundSetUndo(); }
    save(); renderWorkoutBody();
  });
  body.querySelectorAll(".rmSet").forEach(b=>b.onclick=()=>{
    w.exercises[b.dataset.ei].sets.splice(b.dataset.si,1); save(); renderWorkoutBody();
  });
  body.querySelectorAll(".addSetBtn").forEach(b=>b.onclick=()=>{
    const sets = w.exercises[b.dataset.ei].sets;
    const last = sets[sets.length-1];
    sets.push({weight:last?last.weight:0, reps:last?last.reps:0, completed:false, isPR:false});
    save(); renderWorkoutBody();
  });
  body.querySelectorAll(".rm-exblock").forEach(b=>b.onclick=()=>{
    w.exercises.splice(b.dataset.ei,1); save(); renderWorkoutBody();
  });
}

function addExToActive(){
  openExercisePicker((ex)=>{
    state.activeWorkout.exercises.push({exerciseId:ex.id, sets:[{weight:0,reps:10,completed:false,isPR:false}]});
    soundAddEx();
    save(); closeModal(); renderWorkoutBody();
  });
}

document.getElementById("woCancel").onclick = ()=>{
  if(confirm("Discard this workout?")){
    clearInterval(woInterval);
    state.activeWorkout = null; save();
    document.getElementById("workoutOverlay").classList.remove("open");
    stopRestTimer();
  }
};

document.getElementById("woFinish").onclick = ()=>{
  const w = state.activeWorkout;
  const totalSets = w.exercises.reduce((s,e)=>s+e.sets.filter(s2=>s2.completed).length,0);
  if(totalSets===0){ if(!confirm("No sets completed. Finish anyway?")) return; }
  w.duration = Math.floor((Date.now()-w.startedAt)/1000);
  w.exercises = w.exercises.filter(e=>e.sets.some(s=>s.completed)).map(e=>({...e, sets:e.sets.filter(s=>s.completed)}));
  state.history.push(w);
  state.activeWorkout = null;
  save();
  clearInterval(woInterval);
  document.getElementById("workoutOverlay").classList.remove("open");
  stopRestTimer();
  soundWorkoutDone();
  currentTab = "home"; render();
};

if(state.activeWorkout){
  document.getElementById("woTitle").textContent = state.activeWorkout.name;
  document.getElementById("workoutOverlay").classList.add("open");
  renderWorkoutBody();
  woInterval = setInterval(updateWoTimer, 1000);
}

let restRemaining = 0, restTotal = 0;
function startRestTimer(seconds){
  restTotal = seconds; restRemaining = seconds;
  document.getElementById("restTimer").classList.add("open");
  updateRestUI();
  soundRestStart();
  clearInterval(restInterval);
  restInterval = setInterval(()=>{
    restRemaining--;
    if(restRemaining<=0){ stopRestTimer(); soundRestDone(); return; }
    if(restRemaining<=3) soundCountdown();
    updateRestUI();
  },1000);
}
function updateRestUI(){
  const m = Math.floor(restRemaining/60), s = restRemaining%60;
  document.getElementById("restNum").textContent = `${m}:${String(s).padStart(2,"0")}`;
  const circumference = 138;
  const frac = restTotal>0 ? restRemaining/restTotal : 0;
  document.getElementById("restRing").style.strokeDashoffset = (circumference*(1-frac)).toFixed(1);
}
function stopRestTimer(){
  clearInterval(restInterval);
  document.getElementById("restTimer").classList.remove("open");
}
document.getElementById("restSkip").onclick = stopRestTimer;
document.getElementById("restAdd").onclick = ()=>{ restRemaining+=30; restTotal+=30; updateRestUI(); };

function renderHistory(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const workoutDays = new Set(state.history.map(w=>w.date.slice(0,10)));

  let cal = `<div class="cal-grid">` + ["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++) cal += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = new Date(y,m,d).toISOString().slice(0,10);
    cal += `<div class="cal-day ${workoutDays.has(iso)?"has":""}">${d}</div>`;
  }
  cal += `</div>`;

  const sorted = [...state.history].sort((a,b)=>b.date.localeCompare(a.date));
  let list = sorted.map(w=>{
    const vol = w.exercises.reduce((s,e)=>s+e.sets.reduce((s2,st)=>s2+st.weight*st.reps,0),0);
    const hasPR = w.exercises.some(e=>e.sets.some(s=>s.isPR));
    return `<div class="card card-tap hist-card" data-id="${w.id}">
      <div class="row"><div style="font-weight:700">${escapeHtml(w.name)} ${hasPR?'<span class="pr-badge">PR</span>':""}</div>
      <div class="faint" style="font-size:12px">${fmtDate(w.date)}</div></div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">${w.exercises.length} exercises · ${vol.toLocaleString()} ${state.settings.unit} · ${Math.round((w.duration||0)/60)} min</div>
    </div>`;
  }).join("");
  if(sorted.length===0) list = `<div class="empty-state faint">No workouts logged yet.</div>`;

  screenEl.innerHTML = `<h2 class="section-title" style="margin-top:6px">${now.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
    <div class="card">${cal}</div>
    <h2 class="section-title">All Workouts</h2>${list}`;

  screenEl.querySelectorAll(".hist-card").forEach(c=>c.onclick=()=>openWorkoutDetail(c.dataset.id));
}

function openWorkoutDetail(id){
  const w = state.history.find(h=>h.id===id);
  if(!w) return;
  const body = w.exercises.map(e=>{
    const ex = exById(e.exerciseId);
    return `<div style="margin-bottom:12px">
      <div style="font-weight:700;margin-bottom:4px">${ex?ex.name:"?"}</div>
      ${e.sets.map((s,i)=>`<div class="muted mono" style="font-size:13px">Set ${i+1}: ${s.weight} ${state.settings.unit} × ${s.reps} ${s.isPR?'<span class="pr-badge">PR</span>':""}</div>`).join("")}
    </div>`;
  }).join("");
  openModal(`
    <div class="modal-title">${escapeHtml(w.name)}<span class="x" id="mClose">&times;</span></div>
    <div class="faint" style="margin-bottom:14px">${fmtDateFull(w.date)} · ${Math.round((w.duration||0)/60)} min</div>
    ${body}
    <button class="btn btn-danger btn-block" id="delWorkoutBtn" style="margin-top:10px">Delete Workout</button>
  `);
  document.getElementById("mClose").onclick = closeModal;
  document.getElementById("delWorkoutBtn").onclick = ()=>{
    if(confirm("Delete this workout permanently?")){
      state.history = state.history.filter(h=>h.id!==id); save(); closeModal(); render();
    }
  };
}

function svgLineChart(points){
  const w=460, h=140, pad=28;
  if(points.length===0) return `<div class="faint" style="padding:20px 0;text-align:center">Not enough data yet.</div>`;
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const range = (maxY-minY)||1;
  const stepX = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.y-minY)/range)*(h-2*pad);
    return [x,y];
  });
  const path = coords.map((c,i)=>(i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  const dots = coords.map((c)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px">
    <path d="${areaPath}" fill="var(--accent)" opacity="0.08"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad}" y="14" fill="var(--text-faint)" font-size="10" font-family="monospace">${maxY.toLocaleString()}</text>
    <text x="${pad}" y="${h-pad+16}" fill="var(--text-faint)" font-size="10" font-family="monospace">${minY.toLocaleString()}</text>
  </svg>`;
}

function renderProgress(){
  const exIds = [...new Set(state.history.flatMap(w=>w.exercises.map(e=>e.exerciseId)))];
  let selectedEx = window.__progressExId || exIds[0];
  if(!exIds.includes(selectedEx)) selectedEx = exIds[0];
  window.__progressExId = selectedEx;

  let html = `<h2 class="section-title" style="margin-top:6px">Strength Progress</h2>`;
  if(exIds.length===0){
    html += `<div class="empty-state"><div class="big">📈</div>Log a few workouts to see progress charts.</div>`;
  } else {
    const points = state.history.filter(w=>w.exercises.some(e=>e.exerciseId===selectedEx))
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map((w,i)=>{
        const e = w.exercises.find(e=>e.exerciseId===selectedEx);
        const best = Math.max(...e.sets.map(s=>EPLEY(s.weight,s.reps)));
        return {x:i, y:best};
      });
    const volPoints = state.history.filter(w=>w.exercises.some(e=>e.exerciseId===selectedEx))
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map((w,i)=>{
        const e = w.exercises.find(e=>e.exerciseId===selectedEx);
        const vol = e.sets.reduce((s,st)=>s+st.weight*st.reps,0);
        return {x:i, y:vol};
      });
    const currentBest = points.length ? Math.max(...points.map(p=>p.y)) : 0;

    html += `<div class="field"><select id="progExSelect">${exIds.map(id=>`<option value="${id}" ${id===selectedEx?"selected":""}>${exById(id)?.name}</option>`).join("")}</select></div>
    <div class="chart-wrap">
      <div class="row"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em">Estimated 1RM</div></div>
      ${svgLineChart(points)}
      <div class="stat-row">
        <div class="stat-mini"><b>${currentBest.toLocaleString()}</b><span>Best e1RM (${state.settings.unit})</span></div>
        <div class="stat-mini"><b>${points.length}</b><span>Sessions Logged</span></div>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em">Volume Per Session</div>
      ${svgLineChart(volPoints)}
    </div>`;
  }

  const bwPoints = [...state.bodyweight].sort((a,b)=>a.date.localeCompare(b.date)).map((b,i)=>({x:i,y:b.weight}));
  html += `<h2 class="section-title">Body Weight</h2>
  <div class="chart-wrap">
    ${svgLineChart(bwPoints)}
    <div class="row" style="margin-top:10px;gap:8px">
      <input id="bwInput" type="number" inputmode="decimal" placeholder="Weight (${state.settings.unit})" style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:8px">
      <button class="btn btn-primary btn-sm" id="bwAdd">Log</button>
    </div>
  </div>`;

  screenEl.innerHTML = html;
  document.getElementById("progExSelect")?.addEventListener("change",(e)=>{ window.__progressExId=e.target.value; renderProgress(); });
  document.getElementById("bwAdd").onclick = ()=>{
    const val = parseFloat(document.getElementById("bwInput").value);
    if(!val) return;
    state.bodyweight.push({date:todayISO(), weight:val});
    save(); renderProgress();
  };
}

function renderSettings(){
  screenEl.innerHTML = `
  <h2 class="section-title" style="margin-top:6px">Preferences</h2>
  <div class="card">
    <div class="field"><label>Weight Unit</label>
      <select id="unitSelect"><option value="lb" ${state.settings.unit==="lb"?"selected":""}>Pounds (lb)</option>
      <option value="kg" ${state.settings.unit==="kg"?"selected":""}>Kilograms (kg)</option></select>
    </div>
    <div class="field"><label>Default Rest Timer (seconds)</label>
      <input id="restSelect" type="number" value="${state.settings.restSeconds}">
    </div>
  </div>
  <h2 class="section-title">Data</h2>
  <div class="card">
    <div class="muted" style="font-size:13px;margin-bottom:10px">All data is stored only on this device. Back it up regularly.</div>
    <button class="btn btn-ghost btn-block" id="exportBtn" style="margin-bottom:8px">Export Data (.json)</button>
    <button class="btn btn-ghost btn-block" id="importBtn" style="margin-bottom:8px">Import Data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="btn btn-danger btn-block" id="wipeBtn">Erase All Data</button>
  </div>
  <div class="faint" style="text-align:center;font-size:11.5px;margin-top:20px">IRONLOG · fully offline · your data never leaves this device</div>
  `;
  document.getElementById("unitSelect").onchange = (e)=>{ state.settings.unit=e.target.value; save(); };
  document.getElementById("restSelect").onchange = (e)=>{ state.settings.restSeconds=parseInt(e.target.value)||90; save(); };
  document.getElementById("exportBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ironlog-backup-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById("importBtn").onclick = ()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!confirm("This will replace all current data. Continue?")) return;
        state = data; save(); render();
      }catch(err){ alert("Invalid backup file."); }
    };
    reader.readAsText(file);
  };
  document.getElementById("wipeBtn").onclick = ()=>{
    if(confirm("This will permanently erase all workouts, routines, and progress. Continue?")){
      localStorage.removeItem(STORE_KEY);
      state = load(); render();
    }
  };
}

function openModal(html){
  document.getElementById("modalSheet").innerHTML = html;
  document.getElementById("modalBg").classList.add("open");
}
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }
document.getElementById("modalBg").addEventListener("click",(e)=>{ if(e.target.id==="modalBg") closeModal(); });

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

render();

})();
</script>

</html>
